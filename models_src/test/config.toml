title = "テスト"

[model]
smf = "model.mid"
list = "model.list.txt"

[threshold]
# 遅れすぎ検出スレッショルド（テンポ補正後Inter-Onset Interval (IOI)比）
max_time_ratio = 1.2
# 遅れすぎ検出スレッショルド（テンポ補正後Inter-Onset Interval (IOI)差分・秒）
max_time_diff = 0.125
# 早すぎ検出スレッショルド（テンポ補正後Inter-Onset Interval (IOI)比）
min_time_ratio = 0.8
# 早すぎ検出スレッショルド（テンポ補正後Inter-Onset Interval (IOI)差分・秒）
min_time_diff = -0.625
# 長すぎ検出スレッショルド（テンポ補正後の比）
max_duration_ratio = 1.2
# 長すぎ検出スレッショルド（テンポ補正後の差分・単位秒）
max_duration_diff = 0.0625
# 短すぎ検出スレッショルド（テンポ補正後の比）
min_duration_ratio = 0.8
# 短すぎ検出スレッショルド（テンポ補正後の差分・単位秒）
min_duration_diff = -0.03125
# テンポ速すぎ検出スレッショルド
max_tempo_ratio = 1.2
# テンポ遅すぎ検出スレッショルド
min_tempo_ratio = 0.8

[text]
missing = "" # 空文字列はバツ印
extra = "余計" # 空文字列は文字なし
far_behind = "遅れすぎ"
far_ahead = "早すぎ"
too_long = "長すぎ"
too_short = "短すぎ"
tempo_too_fast = "テンポ速すぎ"
tempo_too_slow = "テンポ遅すぎ"
perfect = "すばらしい！"
